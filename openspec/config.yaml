schema: spec-driven

context: |
  Repository: yugastore-java
  Stack: Java 17, Spring Boot 2.6.3, Maven multi-module services, React UI wrapper, YugabyteDB.
  Services: eureka-server-local, api-gateway-microservice, products-microservice, checkout-microservice, cart-microservice, login-microservice, react-ui.
  Persistence split: products and checkout use YCQL. cart and login use YSQL/PostgreSQL-compatible access.
  Workflow: raw docs/images/transcripts -> resources/prds/*.md -> openspec/changes/<change-name>/ -> GitHub issues -> implementation.
  PRD is the product intent. OpenSpec is the execution contract. GitHub issues are thin wrappers around OpenSpec tasks.
  Keep artifacts lightweight, bounded, and practical for a small team. Avoid duplicate prose across PRD, OpenSpec, and issues.
  Do not guess when requirements are ambiguous. Ask focused clarifying questions, separate facts from assumptions, and mark unresolved decisions explicitly.

rules:
  proposal:
    - Keep the proposal concise and scoped to one bounded change.
    - If the source PRD implies multiple independent workstreams, split them into multiple changes instead of one large proposal.
    - Reference the source PRD path when the change is derived from a PRD.
  design:
    - Create design notes only for decisions that affect implementation, integration, migration, security, or sequencing.
    - When the change is straightforward, keep design brief and explicitly state that no additional design complexity is required.
  specs:
    - Capture only behavior that is changing.
    - Use normative SHALL or MUST language and make every scenario testable.
    - Keep capability boundaries aligned to bounded implementation changes.
  tasks:
    - Group tasks into bounded implementation slices that can each map to one thin GitHub issue or one focused coding session.
    - Keep tasks dependency-ordered and small enough for one agent session.
    - Mention primary module or service names in task descriptions when it helps downstream issue generation.

